plugins {
    id 'com.android.application'
}

def releaseKeyPath = System.getenv('RELEASE_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseKeyPath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.goldmovel'
    compileSdk 35

    defaultConfig {
        applicationId 'com.goldmovel'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeyPath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
